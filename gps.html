<!DOCTYPE html>
<html>
<head>
    <title>Garmin eTrex H Live Text Stream</title>
    <style>
        body { font-family: monospace; background: #222; color: #0f0; padding: 20px; }
        button { background: #444; color: white; border: 1px solid #666; padding: 10px 20px; cursor: pointer; font-size: 16px; }
        button:hover { background: #555; }
        #terminal { width: 100%; height: 400px; background: #000; border: 1px solid #444; padding: 10px; margin-top: 20px; overflow-y: scroll; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>Garmin eTrex H - Chrome Serial Monitor</h1>
    <p>Connect your GPS, set Interface to "TEXT OUT", and click connect.</p>
    <button id="connectBtn">Connect to GPS</button>
    
    <div id="terminal">Awaiting connection...</div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const terminal = document.getElementById('terminal');

        connectBtn.addEventListener('click', async () => {
            if (!("serial" in navigator)) {
                terminal.innerText = "Error: Your browser does not support the Web Serial API. Please ensure you are using Google Chrome.";
                return;
            }

            try {
                // 1. Prompt user to select their Serial-to-USB COM port
                const port = await navigator.serial.requestPort();
                
                // 2. Open the port specifically at 4800 Baud Rate for the eTrex
                await port.open({ baudRate: 4800 });
                terminal.innerText = "Connected! Waiting for Garmin data stream...\n";
                
                // 3. Set up a text decoder stream to capture plain text
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();

                // 4. Continuously read incoming data packets
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        reader.releaseLock();
                        break;
                    }
                    if (value) {
                        // Append incoming raw text characters onto the screen
                        terminal.innerText += value;
                        // Auto-scroll the terminal box down
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                }
            } catch (error) {
                terminal.innerText += `\nError connecting: ${error.message}`;
            }
        });
    </script>
</body>
</html>
